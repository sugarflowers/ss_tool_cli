name: Build All Platforms

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: target/release/ss_tool_cli.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build macOS
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: target/release/ss_tool_cli
