name: Build All Platforms

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows
        run: cargo build --release

      - name: Create Windows ZIP
        run: |
          powershell Compress-Archive -Path target/release/ss_tool_cli.exe -DestinationPath ss_tool_cli_win.zip

      - name: Create or update release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ss_tool_cli_win.zip
          asset_name: ss_tool_cli_win.zip
          asset_content_type: application/zip

  mac:
    runs-on: macos-latest
    needs: windows   # ← Windows の upload_url を受け取る
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
  
      - name: Install Tauri CLI
        run: cargo install tauri-cli
  
      - name: Build macOS app
        run: cargo tauri build
  
      - name: Create macOS ZIP
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -r ss_tool_cli_mac.zip ss_tool_cli.app
  
      - name: Upload macOS release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.windows.outputs.upload_url }}
          asset_path: src-tauri/target/release/bundle/macos/ss_tool_cli_mac.zip
          asset_name: ss_tool_cli_mac.zip
          asset_content_type: application/zip
