name: Build All Platforms

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      win_zip: ${{ steps.zip.outputs.win_zip }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows
        run: cargo build --release

      - name: Create Windows ZIP
        id: zip
        run: |
          powershell Compress-Archive -Path target/release/ss_tool_cli.exe -DestinationPath ss_tool_cli_win.zip
          echo "win_zip=ss_tool_cli_win.zip" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: ss_tool_cli_win.zip

  mac:
    runs-on: macos-latest
    outputs:
      mac_zip: ${{ steps.zip.outputs.mac_zip }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build macOS
        run: cargo build --release

      - name: Create macOS ZIP
        id: zip
        run: |
          zip -j ss_tool_cli_mac.zip target/release/ss_tool_cli
          echo "mac_zip=ss_tool_cli_mac.zip" >> $GITHUB_OUTPUT

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ss_tool_cli_mac.zip

  release:
    runs-on: ubuntu-latest
    needs: [windows, mac]
    steps:
      - uses: actions/checkout@v4

      - name: Delete existing latest release if exists
        run: |
          gh release delete latest -y || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new latest release
        run: |
          gh release create latest --title "Latest Build" --notes "Auto build"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload Windows asset
        run: |
          gh release upload latest artifacts/windows-app/ss_tool_cli_win.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS asset
        run: |
          gh release upload latest artifacts/macos-app/ss_tool_cli_mac.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
